<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | WeTransfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }
        .dashboard-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            font-weight: 300;
            font-size: 28px;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .sub {
            font-weight: 400;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }
        .retry-btn {
            display: inline-block;
            margin-top: 24px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 99px;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            text-decoration: none;
        }
        .retry-btn:hover {
            background: #333;
            transform: scale(1.02);
        }
        .retry-btn:active {
            transform: scale(0.98);
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <span class="icon">⏳</span>
        <h1>Service Unavailable</h1>
        <p class="sub">
            We're currently experiencing high demand. Please try again later.
            <br><br>
            <span style="font-size: 14px; color: #888;">We'll notify you when it's back up.</span>
        </p>
        <a href="/" class="retry-btn">← Go Back</a>
        <div class="footer">WeTransfer &bull; Secure file sharing</div>
    </div>
</body>
</html>
